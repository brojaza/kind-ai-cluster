# Default values for the open-webui chart. See README.md at the repo root for context.

replicaCount: 1

nameOverride: ""
# Pinned so the Service is always named "open-webui" regardless of the Helm release
# name Argo CD assigns.
fullnameOverride: "open-webui"

image:
  repository: ghcr.io/open-webui/open-webui
  tag: main # Pin to a specific release for reproducible deployments
  pullPolicy: IfNotPresent

backend:
  # Internal cluster DNS name of the vllm chart's Service. If you change the vllm
  # chart's fullnameOverride or its Argo CD destination.namespace away from "llm",
  # update this to match.
  #
  # If charts/vllm/values.yaml has autoscaling.scaleToZero.enabled: true, point this at
  # the interceptor proxy Service it creates instead, or requests will bypass KEDA's
  # scale-from-zero wake-up and just fail once vllm is scaled to 0:
  #   baseUrl: "http://vllm-proxy.llm.svc.cluster.local:8080/v1"
  baseUrl: "http://vllm-proxy.llm.svc.cluster.local:8080/v1"
  # How long Open WebUI waits on a GET /v1/models call before giving up (its default
  # is 10s). If charts/vllm's autoscaling.scaleToZero is enabled, 10s isn't enough -
  # the KEDA interceptor holds that request while vllm cold-starts (~4 minutes
  # measured, model load + one-time GPU kernel JIT compile), so Open WebUI times out
  # first and shows "no model detected" even though vllm is actually on its way up.
  # Raised to cover that; means a fully-cold page load can sit loading for a while
  # instead of erroring immediately. Set back to 10 if scaleToZero is off.
  modelListTimeoutSeconds: 300
  # If set, skips live model discovery (GET /v1/models) entirely and shows this model
  # id in the picker unconditionally - see open_webui/routers/openai.py's
  # get_all_models_responses(): a non-empty api_configs[idx].model_ids list short-
  # circuits straight to a synthetic response, no HTTP call made. Recommended whenever
  # scaleToZero is on: removes the dependency on modelListTimeoutSeconds above, and
  # means Open WebUI never triggers a KEDA wake-up just by loading the model list.
  # Must match charts/vllm/values.yaml's model.servedName. Leave "" to use live
  # discovery (the default, fine when scaleToZero is off).
  #
  # NOTE: Open WebUI only reads OPENAI_API_BASE_URL/OPENAI_API_CONFIGS to *seed* its
  # database on first boot - once written, the DB value takes precedence over the env
  # var on every subsequent boot. If you're changing this on an already-running
  # cluster (not a fresh PVC), the env var change alone won't take effect; you also
  # need to update the persisted value directly, e.g.:
  #   kubectl -n llm exec deploy/open-webui -- python3 -c "..." (see git history/chat
  #   log for the exact one-off snippet used here), then restart the pod.
  hardcodedModelId: "gemma-4-E4B-it-qat-mobile"
  # vLLM doesn't check this by default (no --api-key flag is set in the vllm chart),
  # but Open WebUI expects a non-empty value before it will query an OpenAI-compatible
  # connection.
  apiKey: "sk-local-no-auth"

auth:
  # The first account registered after install becomes the Open WebUI admin.
  enabled: true

# Used to sign session cookies. Fine as a placeholder for a local throwaway cluster;
# change it to a random string (e.g. `openssl rand -hex 32`) for anything longer-lived,
# since anyone with this value can forge sessions.
webuiSecretKey: "change-this-to-a-random-string"

service:
  type: NodePort
  port: 8080
  # Matches the hostPort mapping in kind-config.yaml (30080 -> 8080).
  nodePort: 30080

ingress:
  enabled: false
  className: ""
  host: open-webui.local
  annotations: {}

persistence:
  enabled: true
  storageClassName: standard
  size: 10Gi
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: "250m"
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}
