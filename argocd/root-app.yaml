# Bootstrap Application - "app of apps" root. Apply this one manually:
#   kubectl apply -f argocd/root-app.yaml
# Points at argocd/appsets, which holds the two ApplicationSets (workload-apps.yaml,
# platform-apps.yaml) that auto-discover the actual workload/platform Applications
# from argocd/workload-apps/*.yaml and argocd/platform-apps/*.yaml respectively - see
# those files.
# Everything past this one manual apply is synced automatically by Argo CD from git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kind-ai-cluster
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/brojaza/kind-ai-cluster.git
    targetRevision: main
    path: argocd/appsets
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
