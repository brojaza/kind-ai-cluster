# Auto-discovers application workloads: one Application per file matching
# argocd/workload-apps/*.yaml. Add a new app by dropping a new minimal params file
# there (see argocd/workload-apps/vllm.yaml for the shape) - no need to touch this
# ApplicationSet or the root Application.
#
# Companion to argocd/appsets/platform-apps.yaml, which watches
# argocd/platform-apps/*.yaml instead - see README.md's "Application structure"
# section for the workload-vs-platform split.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workload-apps
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/brojaza/kind-ai-cluster.git # <-- run prereqs/apply-env.sh
        revision: main
        files:
          - path: "argocd/workload-apps/*.yaml"
  template:
    metadata:
      name: '{{.name}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/brojaza/kind-ai-cluster.git # <-- run prereqs/apply-env.sh
        targetRevision: main
        path: '{{.sourcePath}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
  # Per-app opt-in for the KEDA/selfHeal fix (set ignoreReplicas: true in the app's
  # argocd/workload-apps/*.yaml, e.g. vllm.yaml). templatePatch's merge behavior for list
  # fields isn't documented precisely, so the patch below re-states the FULL
  # syncOptions list rather than assuming it appends - correct either way, whether
  # the patch replaces the list wholesale or (harmlessly) concatenates onto it.
  #
  # The `source.helm.parameters` block below is how prereqs/apply-env.sh's values reach
  # each chart now (see argocd/workload-apps/vllm.yaml's comment) - each `if` guards a
  # field that not every file in this generator sets (open-webui.yaml has no
  # gpuEnabled, for instance), so a file missing a given field just skips that
  # parameter entirely rather than erroring or emitting an empty value.
  templatePatch: |
    spec:
      {{- if .ignoreReplicas }}
      # KEDA (see charts/vllm/templates/httpscaledobject.yaml) drives spec.replicas
      # directly when autoscaling.scaleToZero is on. Without this, selfHeal fights it
      # every reconcile: KEDA scales to 0, Argo CD sees a diff from the chart's
      # static replicaCount and scales back to 1, KEDA scales to 0 again, etc.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          name: {{.name}}
          jsonPointers:
            - /spec/replicas
      {{- end }}
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          {{- if .ignoreReplicas }}
          # Without this, ignoreDifferences above only suppresses the OutOfSync/
          # selfHeal diff - an actual sync would still apply spec.replicas from the
          # manifest and stomp on whatever KEDA set.
          - RespectIgnoreDifferences=true
          {{- end }}
      {{- if or .gpuEnabled .scaleToZeroEnabled .scaledownPeriod .chatHost }}
      source:
        helm:
          parameters:
            {{- if .gpuEnabled }}
            - name: gpu.enabled
              value: "{{.gpuEnabled}}"
            {{- end }}
            {{- if .scaleToZeroEnabled }}
            - name: autoscaling.scaleToZero.enabled
              value: "{{.scaleToZeroEnabled}}"
            {{- end }}
            {{- if .scaledownPeriod }}
            - name: autoscaling.scaleToZero.scaledownPeriod
              value: "{{.scaledownPeriod}}"
            {{- end }}
            {{- if .chatHost }}
            - name: ingress.host
              value: "{{.chatHost}}"
            {{- end }}
      {{- end }}
