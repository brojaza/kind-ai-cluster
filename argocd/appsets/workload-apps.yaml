# Auto-discovers application workloads: one Application per file matching
# argocd/workload-apps/*.yaml. Add a new app by dropping a new minimal params file
# there (see argocd/workload-apps/vllm.yaml for the shape) - no need to touch this
# ApplicationSet or the root Application.
#
# Companion to argocd/appsets/platform-apps.yaml, which watches
# argocd/platform-apps/*.yaml instead - see README.md's "Application structure"
# section for the workload-vs-platform split.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workload-apps
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/brojaza/kind-ai-cluster.git # <-- run scripts/00-set-repo-url.sh
        revision: main
        files:
          - path: "argocd/workload-apps/*.yaml"
  template:
    metadata:
      name: '{{.name}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/brojaza/kind-ai-cluster.git # <-- run scripts/00-set-repo-url.sh
        targetRevision: main
        path: '{{.sourcePath}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
  # Per-app opt-in for the KEDA/selfHeal fix (set ignoreReplicas: true in the app's
  # argocd/workload-apps/*.yaml, e.g. vllm.yaml). templatePatch's merge behavior for list
  # fields isn't documented precisely, so the patch below re-states the FULL
  # syncOptions list rather than assuming it appends - correct either way, whether
  # the patch replaces the list wholesale or (harmlessly) concatenates onto it.
  templatePatch: |
    {{- if .ignoreReplicas }}
    spec:
      # KEDA (see charts/vllm/templates/httpscaledobject.yaml) drives spec.replicas
      # directly when autoscaling.scaleToZero is on. Without this, selfHeal fights it
      # every reconcile: KEDA scales to 0, Argo CD sees a diff from the chart's
      # static replicaCount and scales back to 1, KEDA scales to 0 again, etc.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          name: {{.name}}
          jsonPointers:
            - /spec/replicas
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          # Without this, ignoreDifferences above only suppresses the OutOfSync/
          # selfHeal diff - an actual sync would still apply spec.replicas from the
          # manifest and stomp on whatever KEDA set.
          - RespectIgnoreDifferences=true
    {{- end }}
